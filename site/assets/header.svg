<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320"
     role="img" aria-label="lore — shared knowledge for AI coding sessions">
  <title>lore</title>

  <!--
    Sibling of the agentmesh and kenward headers: same ground, grid, vignette,
    corner ticks and monospace wordmark. Where agentmesh draws peers passing
    messages and kenward draws a household in plan, this draws three stores
    holding the same entry — the lit line is the one they all have.
    Designed for a dark ground; it paints its own, so it drops onto a light
    page unchanged.
  -->

  <defs>
    <pattern id="lh-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    </pattern>
    <radialGradient id="lh-vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%"  stop-color="#0A0908" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="lh-lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#E8C674" stop-opacity="0.26"/>
      <stop offset="55%"  stop-color="#E8C674" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#E8C674" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="#0A0908"/>
  <rect width="1200" height="320" fill="url(#lh-grid)" opacity="0.55"/>
  <rect width="1200" height="320" fill="url(#lh-vignette)"/>

  <!-- frame ticks -->
  <g stroke="#E8E6E1" stroke-width="1.5" fill="none">
    <path d="M40 32 L40 16 L72 16"/>
    <path d="M1160 32 L1160 16 L1128 16"/>
    <path d="M40 288 L40 304 L72 304"/>
    <path d="M1160 288 L1160 304 L1128 304"/>
  </g>

  <!-- meta line -->
  <text x="88" y="22" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#7A7A7A" letter-spacing="2.4">bsl 1.1 · local-first · mcp-native</text>

  <!-- wordmark -->
  <text x="40" y="172" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="108" font-weight="800" fill="#E8E6E1" letter-spacing="-4">lore</text>

  <!-- accent underbar -->
  <rect x="40" y="186" width="120" height="3" fill="#E8C674"/>

  <!-- tagline -->
  <text x="40" y="226" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="19" fill="#D6D4CF" letter-spacing="-0.2">shared knowledge for AI coding sessions.</text>
  <text x="40" y="252" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#8A8A8A" letter-spacing="0.6">mcp tools · a go library · lan sync over mtls · a relay that only ever holds ciphertext</text>

  <!-- right-side diagram: three stores, one entry -->
  <g transform="translate(860, 60)">
    <rect x="0" y="0" width="280" height="200" fill="none" stroke="#5A5A5A" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="8" y="-6" font-family="ui-monospace,monospace" font-size="10" fill="#7A7A7A" letter-spacing="1.6">one space</text>

    <circle cx="140" cy="100" r="66" fill="url(#lh-lamp)"/>

    <!-- edges, drawn first so the opaque stores sit over them -->
    <g stroke="#9A9A9A" stroke-width="1.5" stroke-dasharray="4 5">
      <path d="M140 46 L64 140"/>
      <path d="M140 46 L216 140"/>
      <path d="M64 140 H216"/>
    </g>

    <!-- a store: a card of entries, the first one lit -->
    <g>
      <rect x="106" y="20" width="68" height="46" rx="3" fill="#0A0908" stroke="#E8E6E1" stroke-width="1.8"/>
      <path d="M116 34 H164" stroke="#E8C674" stroke-width="3"/>
      <path d="M116 43 H164" stroke="#E8E6E1" stroke-width="2" opacity="0.5"/>
      <path d="M116 52 H150" stroke="#E8E6E1" stroke-width="2" opacity="0.5"/>
    </g>
    <g>
      <rect x="30" y="118" width="68" height="46" rx="3" fill="#0A0908" stroke="#E8E6E1" stroke-width="1.8"/>
      <path d="M40 132 H88" stroke="#E8C674" stroke-width="3"/>
      <path d="M40 141 H88" stroke="#E8E6E1" stroke-width="2" opacity="0.5"/>
      <path d="M40 150 H74" stroke="#E8E6E1" stroke-width="2" opacity="0.5"/>
    </g>
    <g>
      <rect x="182" y="118" width="68" height="46" rx="3" fill="#0A0908" stroke="#E8E6E1" stroke-width="1.8"/>
      <path d="M192 132 H240" stroke="#E8C674" stroke-width="3"/>
      <path d="M192 141 H240" stroke="#E8E6E1" stroke-width="2" opacity="0.5"/>
      <path d="M192 150 H226" stroke="#E8E6E1" stroke-width="2" opacity="0.5"/>
    </g>

    <g font-family="ui-monospace,monospace" font-size="9" fill="#88BFA8" letter-spacing="1.3" text-anchor="middle">
      <text x="140" y="14">desktop</text>
      <text x="64"  y="178">laptop</text>
      <text x="216" y="178">teammate</text>
    </g>
  </g>
</svg>
